<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EpinetLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --paper: #eef0fa; --panel: #ffffff; --ink: #1b1f3b; --muted: #5d6285;
    --line: #d5d9ec; --tie: #3a3fc4; --tie-soft: #e6e7fb; --broker: #f2a900;
    --reply: #d8f1ec; --error: #b3261e;
    --ui: 'Lato', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--ui); color: var(--ink); line-height: 1.5;
    background-color: var(--paper);
    background-image: radial-gradient(circle, #c9cdea 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  #main-layout { display: flex; gap: 16px; height: 100vh; padding: 16px; max-width: 1400px; margin: 0 auto; }

  #chat-area { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  /* Header: the one loud element. The sociogram's ties pulse while a reply is being written. */
  #app-header { display: flex; align-items: center; gap: 18px; padding: 16px 22px; background: var(--ink); color: #fff; }
  #sociogram { flex: none; width: 108px; height: 58px; }
  #sociogram .tie { stroke: #8f94e8; stroke-width: 1.4; fill: none; }
  #sociogram .node { fill: #c9ccff; }
  #sociogram .broker { fill: var(--broker); }
  body.working #sociogram .tie { stroke: #c9ccff; stroke-dasharray: 3 5; animation: flow 0.9s linear infinite; }
  body.working #sociogram .broker { animation: beat 0.9s ease-in-out infinite; transform-origin: 40px 32px; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  @keyframes beat { 50% { transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) {
    body.working #sociogram .tie, body.working #sociogram .broker { animation: none; }
  }
  #app-header h1 { margin: 0 0 2px; font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
  #app-header p { margin: 0; color: #c3c6e6; font-size: 0.95rem; max-width: 60ch; }

  #chat-container { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #chat-history { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }

  .msg { padding: 12px 16px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: 80%; background: var(--reply); border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .msg.assistant {
    align-self: flex-start; position: relative; margin-left: 20px; max-width: min(46rem, calc(100% - 20px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
    line-height: 1.6;
  }
  /* Each reply hangs off a node, like a tie leaving an actor. */
  .msg.assistant::before { content: ""; position: absolute; left: -20px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--tie); }
  .msg.assistant::after { content: ""; position: absolute; left: -10px; top: 19.5px; width: 10px; height: 1px; background: var(--tie); }
  .msg.assistant > :first-child { margin-top: 0; }
  .msg.assistant > :last-child { margin-bottom: 0; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { font-size: 1.05rem; font-weight: 700; color: var(--tie); margin: 1em 0 0.35em; }
  .msg.assistant ul, .msg.assistant ol { padding-left: 1.3em; }
  .msg.assistant blockquote { margin: 0.8em 0; padding-left: 12px; border-left: 3px solid var(--broker); color: var(--muted); }
  .msg.assistant code { font-size: 0.9em; background: var(--tie-soft); padding: 1px 4px; border-radius: 4px; }
  .msg.pending { color: var(--muted); font-style: italic; }

  #chat-input-area { display: flex; gap: 8px; align-items: flex-end; padding: 12px 22px; border-top: 1px solid var(--line); background: #fafbff; }
  textarea { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: none; width: 100%; background: #fff; }
  textarea::placeholder { color: #8388a8; }
  #user-input::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--tie); outline-offset: 2px; }
  #user-input { max-height: 220px; }

  button { font: inherit; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  button:hover { border-color: var(--tie); color: var(--tie); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #send-button { background: var(--tie); color: #fff; border-color: var(--tie); display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; flex: none; }
  #send-button:hover { background: #2c30a6; color: #fff; }
  .error-display { color: var(--error); padding: 0 22px; font-size: 0.92rem; min-height: 1.2em; background: #fafbff; }
  #chat-container > #reset-button { margin: 4px 22px 14px; align-self: flex-start; font-weight: 400; font-size: 0.9rem; }
  #chat-container::after { content: none; }

  #context-container { flex: 0 0 320px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--broker); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #context-container h2 { margin: 0; font-size: 1.1rem; }
  #context-input { flex: 1 1 auto; min-height: 160px; }
  #context-buttons { display: flex; gap: 8px; }
  #set-context-button { background: var(--tie-soft); border-color: var(--tie-soft); color: var(--tie); }
  #context-status { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; align-self: flex-start; }
  #context-status.is-set { color: var(--tie); background: var(--tie-soft); padding: 3px 10px; border-radius: 999px; }
  .copy-button { display: block; margin-top: 10px; padding: 3px 10px; font-size: 0.8rem; font-weight: 400; border-radius: 8px; color: var(--muted); }

  @media (max-width: 800px) {
    #main-layout { flex-direction: column; height: auto; min-height: 100vh; padding: 10px; }
    #chat-area { height: 78vh; }
    #context-container { flex: none; }
    #sociogram { width: 72px; height: 40px; }
    #app-header h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div id="main-layout">
  <div id="chat-area">
    <div id="app-header">
      <svg id="sociogram" viewBox="0 0 120 64" aria-hidden="true">
        <path class="tie" d="M12 14 40 32M14 50 40 32M12 14 14 50M40 32 74 14M40 32 78 50M74 14 78 50M74 14 108 30M78 50 108 30"/>
        <circle class="node" cx="12" cy="14" r="4.5"/><circle class="node" cx="14" cy="50" r="4.5"/>
        <circle class="node" cx="74" cy="14" r="4.5"/><circle class="node" cx="78" cy="50" r="4.5"/>
        <circle class="node" cx="108" cy="30" r="4.5"/>
        <circle class="broker" cx="40" cy="32" r="6.5"/>
      </svg>
      <div>
        <h1>EpinetLens</h1>
        <p>Chat with EpinetLens, your guide to seeing the world through the lens of epistemic networks.</p>
      </div>
    </div>
    <div id="chat-container">
      <div id="chat-history"></div>
      <div id="chat-input-area">
        <textarea id="user-input" placeholder="Your response (Shift+Enter for new line)..." rows="1"></textarea>
        <button id="send-button" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/></svg>
        </button>
      </div>
      <div id="error-message" class="error-display"></div>
      <button id="reset-button">Reset Conversation &amp; Context</button>
    </div>
  </div>

  <div id="context-container">
    <h2>Persistent Context:</h2>
    <textarea id="context-input" placeholder="Enter background context here for the AI to consider..." rows="10"></textarea>
    <div id="context-buttons">
      <button id="set-context-button">Set Context</button>
      <button id="clear-context-button">Clear Context</button>
    </div>
    <div id="context-status"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// SETTINGS — edit these two lines, nothing else needs to change.
// ---------------------------------------------------------------------
const WORKER_URL = "https://late-art-e9b0.joel-a-c-baum.workers.dev"; // your Cloudflare Worker URL
const WORKSHOP_CODE = ""; // must match WORKSHOP_CODE in the worker (leave blank if unused)
// ---------------------------------------------------------------------

const GREETING = "Hi! I’m EpinetLens. Think of me as your backstage pass to the world of epistemic networks. I can help you learn about the Epinets framework, or you can drop a text—an article, a rant, a social media post—in the context window, and I’ll show you how trust, authority, and interpretation are really being constructed behind the scenes. How can I assist you today?";

const historyEl = document.getElementById("chat-history");
const inputEl = document.getElementById("user-input");
const sendBtn = document.getElementById("send-button");
const errorEl = document.getElementById("error-message");
const resetBtn = document.getElementById("reset-button");
const contextInput = document.getElementById("context-input");
const contextStatus = document.getElementById("context-status");

let messages = [];   // the conversation, resent to the worker each turn
let context = "";    // the persistent context currently in force
let busy = false;

function renderMarkdown(text) {
  // If the formatting libraries fail to load, fall back to safe plain text.
  if (!window.DOMPurify || !window.marked) {
    const d = document.createElement("div");
    d.textContent = text;
    return '<div style="white-space:pre-wrap">' + d.innerHTML + "</div>";
  }
  return DOMPurify.sanitize(marked.parse(text));
}

function addBubble(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "user") el.textContent = text;
  else { el.innerHTML = renderMarkdown(text); if (text) attachCopy(el); }
  historyEl.appendChild(el);
  historyEl.scrollTop = historyEl.scrollHeight;
  return el;
}

function setBusy(state) {
  busy = state;
  sendBtn.disabled = state;
  document.body.classList.toggle("working", state);
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 220) + "px";
}

async function send() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text) return;

  errorEl.textContent = "";
  setBusy(true);
  addBubble("user", text);
  messages.push({ role: "user", content: text });
  inputEl.value = "";
  autoGrow();

  const bubble = addBubble("assistant", "");
  bubble.classList.add("pending");
  bubble.textContent = "Thinking…";
  let reply = "";

  try {
    const headers = { "content-type": "application/json" };
    if (WORKSHOP_CODE) headers["x-workshop-code"] = WORKSHOP_CODE;

    const resp = await fetch(WORKER_URL, {
      method: "POST",
      headers,
      body: JSON.stringify({ messages, context }),
    });

    if (!resp.ok) {
      let detail = "Request failed (" + resp.status + ").";
      try {
        const j = await resp.json();
        if (typeof j.error === "string") detail = j.error;
        else if (j.error && j.error.message) detail = j.error.message;
      } catch (e) {}
      throw new Error(detail);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let truncated = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        let evt;
        try { evt = JSON.parse(payload); } catch (e) { continue; }

        if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
          reply += evt.delta.text;
          bubble.classList.remove("pending");
          bubble.innerHTML = renderMarkdown(reply);
          historyEl.scrollTop = historyEl.scrollHeight;
        } else if (evt.type === "message_delta" && evt.delta && evt.delta.stop_reason === "max_tokens") {
          truncated = true;
        } else if (evt.type === "error") {
          throw new Error((evt.error && evt.error.message) || "The model returned an error.");
        }
      }
    }

    if (!reply) throw new Error("No reply was received.");
    messages.push({ role: "assistant", content: reply });
    attachCopy(bubble);
    if (truncated) errorEl.textContent = "That reply hit the length limit. Type \"continue\" to pick up where it stopped.";
  } catch (err) {
    // Roll back so the conversation stays well-formed and the text isn't lost.
    if (reply) {
      messages.push({ role: "assistant", content: reply });
      attachCopy(bubble);
    } else {
      messages.pop();
      bubble.remove();
      historyEl.lastChild && historyEl.lastChild.remove();
      inputEl.value = text;
      autoGrow();
    }
    errorEl.textContent = "Error: " + (err.message || "Something went wrong.");
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

// Adds a "Copy" button under a finished reply; copies it with its formatting.
function attachCopy(bubble) {
  const html = bubble.innerHTML;
  const text = bubble.textContent || "";
  const btn = document.createElement("button");
  btn.className = "copy-button";
  btn.setAttribute("aria-label", "Copy response text");
  btn.title = "Copy response text (with formatting)";
  btn.textContent = "Copy";
  btn.addEventListener("click", async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" }),
        })]);
      } else {
        await navigator.clipboard.writeText(text);
      }
      btn.textContent = "Copied!";
    } catch (e) {
      btn.textContent = "Error";
    }
    setTimeout(() => { btn.textContent = "Copy"; }, 2000);
  });
  bubble.appendChild(btn);
}

// The context is remembered in this browser between visits.
const CONTEXT_STORAGE_KEY = "persistentChatContext";
function storeContext(value) {
  try {
    if (value) localStorage.setItem(CONTEXT_STORAGE_KEY, value);
    else localStorage.removeItem(CONTEXT_STORAGE_KEY);
  } catch (e) {}
}
function updateContextStatus() {
  contextStatus.textContent = context ? "Context is set and will be used." : "No context set.";
  contextStatus.classList.toggle("is-set", !!context);
}
function clearContext() {
  context = "";
  contextInput.value = "";
  storeContext("");
  updateContextStatus();
}

function resetAll() {
  if (busy) return;
  if (!confirm("Are you sure you want to reset the conversation and clear context?")) return;
  messages = [];
  clearContext();
  errorEl.textContent = "";
  historyEl.innerHTML = "";
  inputEl.value = "";
  autoGrow();
  addBubble("assistant", "Conversation reset. How can I help you now?");
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
resetBtn.addEventListener("click", resetAll);

document.getElementById("set-context-button").addEventListener("click", () => {
  context = contextInput.value.trim();
  storeContext(context);
  updateContextStatus();
});
document.getElementById("clear-context-button").addEventListener("click", clearContext);

try { context = (localStorage.getItem(CONTEXT_STORAGE_KEY) || "").trim(); } catch (e) {}
contextInput.value = context;
updateContextStatus();
addBubble("assistant", GREETING);
inputEl.focus();
</script>
</body>
</html>
